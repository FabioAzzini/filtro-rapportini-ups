<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Filtro Rapportini UPS</title>
<style>
:root{--blue:#1e3a8a;--indigo:#4f46e5;--violet:#6366f1;--mid:#e0e7ff;--pale:#eef2ff;--line:#c7d2fe;--text:#0f172a;--muted:#475569;--bg:#f5f7fb;--white:#fff;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px 12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(15,23,42,.06)}
.hrow{display:flex;align-items:center;gap:12px}.logo{width:min(260px,55vw);height:58px;object-fit:contain;object-position:left center}.title{font-size:18px;font-weight:800;color:var(--blue);margin-left:auto;text-align:right}.title small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:3px}
main{max-width:1100px;margin:0 auto;padding:16px}.toolbar{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-bottom:14px}.btn{border:1px solid #cbd5e1;background:#fff;color:var(--text);padding:10px 13px;border-radius:10px;font-weight:700;cursor:pointer}.btn.primary{background:var(--indigo);color:#fff;border-color:var(--indigo)}.btn:active{transform:translateY(1px)}
input[type=file]{display:none}.fileline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.filename{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55vw}.search{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px;outline:none;margin-top:12px}.search:focus{border-color:var(--indigo);box-shadow:0 0 0 3px #e0e7ff}
.meta{font-size:13px;color:var(--muted);margin-top:10px}.client{font-size:16px;font-weight:800;color:var(--blue);margin-top:8px}.ups-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px;margin-top:12px}.ups-item{background:#fff;border:2px solid var(--line);border-radius:13px;padding:12px;cursor:pointer}.ups-item.selected{border-color:var(--blue);box-shadow:0 0 0 2px #dbeafe}.ups-item .top{display:flex;align-items:flex-start;gap:8px}.check{width:20px;height:20px;accent-color:var(--indigo);flex:0 0 auto;margin-top:2px}.ups-name{font-size:15px;font-weight:800;color:var(--blue)}.ups-loc{font-size:12px;color:var(--muted);margin-top:3px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.chip{font-size:10px;padding:4px 7px;border-radius:999px;background:var(--pale);color:var(--blue);font-weight:700}
.report-wrap{margin-top:16px}.report{background:#fff;box-shadow:0 2px 15px rgba(15,23,42,.08);border-radius:3px;max-width:900px;margin:0 auto;padding:22px 28px 30px}.report-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:12px}.report-logo{width:280px;max-width:55%;height:66px;object-fit:contain;object-position:left center}.company{font-size:11px;line-height:1.55;text-align:right;color:#111}.doc-title{margin-top:14px;background:var(--pale);border:1px solid var(--violet);border-radius:9px;padding:8px;text-align:center;color:var(--indigo);font-size:17px;font-weight:800}.badge{margin-top:8px;background:linear-gradient(90deg,var(--indigo),var(--violet));border-radius:8px;padding:7px;color:#fff;text-align:center;font-weight:800;font-size:12px}
.section{margin-top:16px}.section-title{display:flex;align-items:center;gap:8px;color:var(--blue);font-weight:800;font-size:13px;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:6px}.section-title:before{content:"";width:4px;height:15px;background:var(--indigo);border-radius:3px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;margin-top:9px}.field{font-size:11px;line-height:1.35}.field label{font-weight:800;color:var(--muted);display:inline}.field span{color:var(--text)}.field.full{grid-column:1/-1}.table{width:100%;border-collapse:collapse;margin-top:9px;font-size:10px}.table th{background:var(--mid);color:var(--blue);padding:6px 4px;border:1px solid var(--line)}.table td{padding:5px 4px;border:1px solid var(--line);text-align:center}.table td:first-child{background:var(--pale);text-align:left;font-weight:800}.subbox{background:#fafbff;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px}.subhead{font-weight:800;color:var(--blue);font-size:11px;margin-bottom:6px}.note{white-space:pre-wrap;font-size:11px;line-height:1.45}
.selectbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}.selected-count{font-weight:800;color:var(--blue);font-size:13px}.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:22px;text-align:center;color:var(--muted);margin-top:12px}.hint{font-size:11px;color:var(--muted);line-height:1.4;margin-top:8px}
@media(max-width:650px){header{position:static}.title{display:none}.report{padding:15px}.report-head{display:block}.report-logo{max-width:80%;width:260px}.company{text-align:left;margin-top:8px}.grid2{grid-template-columns:1fr}.field.full{grid-column:auto}.ups-list{grid-template-columns:1fr}}
@media print{body{background:#fff}.no-print{display:none!important}.report{box-shadow:none;border-radius:0;max-width:none;margin:0;padding:0}.report-wrap{margin:0}.report-page{page-break-after:always}.report-page:last-child{page-break-after:auto}header{display:none}main{padding:0}.report-head{padding-top:0}}
</style>
</head>
<body>
<header class="no-print"><div class="hrow"><img id="headerLogo" class="logo" alt="Lorenzi Elettronica"><div class="title">Filtro Rapportini UPS<small>Seleziona e consulta le apparecchiature del rapportino originale</small></div></div></header>
<main>
<section class="toolbar no-print">
 <div class="fileline"><label class="btn primary" for="file">📂 Carica rapportino HTML</label><input id="file" type="file" accept=".html,text/html"><span id="filename" class="filename">Nessun file caricato</span><button class="btn" id="installBtn" type="button" style="display:none">📲 Installa app</button><button class="btn" id="clearBtn" type="button">🗑 Azzera</button></div>
 <div class="hint">Il file viene letto direttamente sul dispositivo. Non viene caricato su internet.</div>
 <div id="global" style="display:none"></div>
 <input id="search" class="search" placeholder="🔎 Cerca cliente, posizione, modello, matricola, batteria..." autocomplete="off" style="display:none">
 <div id="stats" class="meta" style="display:none"></div>
 <div id="list" class="ups-list"></div>
 <div id="actions" class="selectbar" style="display:none"><div id="selectedCount" class="selected-count"></div><div style="display:flex;gap:7px"><button class="btn" id="allBtn">☑️ Tutti</button><button class="btn" id="noneBtn">⬜ Nessuno</button><button class="btn primary" id="printBtn">🖨️ Stampa selezionati</button></div></div>
</section>
<div id="reports" class="report-wrap"></div>
<div id="empty" class="empty">Carica un rapportino HTML per iniziare.</div>
</main>

let state={data:null,ups:[],selected:new Set(),fileName:''};
function val(v, fallback='—'){return (v===undefined||v===null||String(v).trim()==='')?fallback:String(v).trim();}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dkey(data,key){return data[key];}
function parseFile(text,name){
 const m=text.match(/<script[^>]*id=["']__saved_data__["'][^>]*>([\s\S]*?)<\/script>/i);
 if(!m) throw new Error('Nel file non trovo i dati salvati del rapportino (__saved_data__).');
 let data; try{data=JSON.parse(m[1]);}catch(e){throw new Error('I dati del rapportino non sono leggibili.');}
 const ids=Array.isArray(data.__ups)?data.__ups.map(String):[];
 if(!ids.length) throw new Error('Nel rapportino non sono presenti apparecchiature UPS.');
 const ups=ids.map((id,n)=>({id,n,loc:val(data['u_loc_'+id]),model:val(data['u_mod_'+id]),sn:val(data['u_sn_'+id]),kva:val(data['u_kva_'+id]),mis:val(data['u_mis_'+id]),batt:val(data['u_nbatt_'+id]),tipobatt:val(data['u_tipobatt_'+id]),carico:val(data['u_carico_'+id])}));
 state={data,ups,selected:new Set(ids),fileName:name};
 $('filename').textContent=name; $('search').style.display='block'; $('stats').style.display='block'; $('actions').style.display='flex'; $('empty').style.display='none';
 render();
}
function hay(u){return [state.data.cliente,state.data.indirizzo,state.data.localita,state.data.provincia,u.loc,u.model,u.sn,u.kva,u.mis,u.batt,u.tipobatt,u.carico].join(' ').toLowerCase();}
function render(){
 const q=$('search').value.trim().toLowerCase(); const arr=state.ups.filter(u=>!q||hay(u).includes(q));
 $('stats').textContent=`${arr.length} UPS visualizzati su ${state.ups.length} · ${state.selected.size} selezionati`;
 $('selectedCount').textContent=`${state.selected.size} selezionati`;
 $('list').innerHTML=arr.map(u=>`<div class="ups-item ${state.selected.has(String(u.id))?'selected':''}" data-id="${esc(u.id)}"><div class="top"><input class="check" type="checkbox" ${state.selected.has(String(u.id))?'checked':''} aria-label="Seleziona UPS"><div><div class="ups-name">⚡ UPS ${u.n+1} · ${esc(u.model)}</div><div class="ups-loc">📍 ${esc(u.loc)}</div><div class="chips"><span class="chip">Matricola ${esc(u.sn)}</span><span class="chip">${esc(u.kva)} VA</span><span class="chip">${esc(u.tipobatt)}</span></div></div></div></div>`).join('') || '<div class="empty" style="grid-column:1/-1">Nessun UPS corrisponde alla ricerca.</div>';
 document.querySelectorAll('.ups-item').forEach(el=>{el.addEventListener('click',e=>{if(e.target.tagName==='INPUT')return; toggle(el.dataset.id);});el.querySelector('.check').addEventListener('change',()=>toggle(el.dataset.id));});

}

 out+=sec('Parti sostituite',`<div class="grid2">${field('Materiali sostituiti',d['u_matsost_'+id])}${field('Ritiro batterie per verifica',d['u_ritirobatt_'+id])}${parts.length?field('Elenco materiali',parts.join(' | '),true):''}</div>`);
 if(d['u_note_'+id])out+=sec('Note',`<div class="subbox note">${esc(d['u_note_'+id])}</div>`);
 if(d['u_noteint_'+id])out+=sec('Note interne',`<div class="subbox note">${esc(d['u_noteint_'+id])}</div>`);
 out+=`</article></div>`;return out;
}
function renderReports(){const sel=state.ups.filter(u=>state.selected.has(String(u.id)));$('reports').innerHTML=sel.length?sel.map(report).join('') : '';$('empty').style.display=(state.data&&!sel.length)?'block':'none';if(state.data&&sel.length)$('empty').style.display='none';}
$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{parseFile(await f.text(),f.name);}catch(err){alert(err.message);}});
$('search').addEventListener('input',render);$('allBtn').addEventListener('click',()=>{state.selected=new Set(state.ups.map(u=>String(u.id)));render();});$('noneBtn').addEventListener('click',()=>{state.selected.clear();render();});
$('printBtn').addEventListener('click',()=>{if(!state.selected.size){alert('Seleziona almeno un UPS.');return;}window.print();});
$('clearBtn').addEventListener('click',()=>{state={data:null,ups:[],selected:new Set(),fileName:''};$('filename').textContent='Nessun file caricato';$('search').style.display='none';$('stats').style.display='none';$('actions').style.display='none';$('list').innerHTML='';$('reports').innerHTML='';$('empty').style.display='block';$('file').value='';});
let deferredInstallPrompt=null;
const installBtn=$('installBtn');
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;installBtn.style.display='inline-flex';});
installBtn.addEventListener('click',async()=>{if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;installBtn.style.display='none';});
window.addEventListener('appinstalled',()=>{installBtn.style.display='none';deferredInstallPrompt=null;});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>
